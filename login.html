<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Hotel Aurora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="login-title">
      <a class="logo login-logo" href="index.html">Hotel Aurora</a>
      <p class="eyebrow">Área de huéspedes</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="login-help">Usa el usuario de prueba para acceder: <strong>demo@hotelaurora.com</strong> / <strong>hotel123</strong></p>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="demo@hotelaurora.com" required />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="hotel123" required />

        <p id="login-message" class="login-message" role="status" aria-live="polite"></p>

        <button class="btn login-btn" type="submit">Entrar</button>
      </form>

      <a class="back-link" href="index.html">← Volver a la landing</a>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
